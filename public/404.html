<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MoverApp</title>
  <script>
    // GitHub Pages SPA redirect — encodes the path into a query param
    // so index.html can restore it via history.replaceState
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + '/' +
      l.pathname.split('/').slice(0, 2).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(1).join('/') +
      (l.search ? '&q=' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
